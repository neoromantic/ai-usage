name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event.pull_request.draft != true
    runs-on: ${{ fromJSON('{"true":"oss-linux","false":"ubuntu-latest"}')[format('{0}', vars.CI_SELF_HOSTED == 'true' && github.ref == 'refs/heads/main')] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The oldest Go that go.mod allows, so code that needs a newer one fails here.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment != 'self-hosted' }}
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "run gofmt -w on:"
            echo "$unformatted"
            exit 1
          fi
      - run: go build ./...
      - name: Shell scripts
        run: |
          for f in install.sh scripts/*.sh .github/scripts/*.sh macos/build.sh; do sh -n "$f"; done
          shellcheck -s sh install.sh scripts/*.sh .github/scripts/*.sh macos/build.sh
      - name: PowerShell script
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | Format-List | Out-String | Write-Host; exit 1 }
      # All but the menu bar app, which builds only on macOS.
      - name: Cross-compile every release target
        run: sh .github/scripts/dist.sh v9.9.9-ci "$RUNNER_TEMP/dist"

  # CI runs no macOS job: macOS is checked on a Mac before the push, with
  # scripts/verify.sh --push, which runs go test on darwin, the menu bar
  # app's checks and release build, and the installer and Homebrew smoke
  # tests there (see AGENTS.md). vet, staticcheck and deadcode still cover
  # darwin here. Windows builds and installs (see lint and install), but its
  # unit tests are not a release gate: Windows is not a supported collector
  # host yet.
  test:
    if: github.event.pull_request.draft != true
    runs-on: ${{ fromJSON('{"true":"oss-linux","false":"ubuntu-latest"}')[format('{0}', vars.CI_SELF_HOSTED == 'true' && github.ref == 'refs/heads/main')] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: ${{ runner.environment != 'self-hosted' }}
      - name: vet, staticcheck and deadcode for every release OS; go mod tidy
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install golang.org/x/tools/cmd/deadcode@v0.52.0
          bin=$(go env GOPATH)/bin
          for os in linux darwin windows; do
            GOOS=$os go vet ./...
            GOOS=$os "$bin/staticcheck" ./...
            d=$(GOOS=$os "$bin/deadcode" -test ./...)
            [ -z "$d" ] || { echo "$d"; exit 1; }
          done
          go mod tidy -diff
      - run: go test -race ./...

  install:
    if: github.event.pull_request.draft != true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ fromJSON(format('{{"true":"oss-linux","false":"{0}"}}', matrix.os))[format('{0}', vars.CI_SELF_HOSTED == 'true' && github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest')] }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: ${{ runner.environment != 'self-hosted' }}
      # Builds this runner's release file, serves it on 127.0.0.1, and runs
      # install.sh or install.ps1 against it twice: a fresh install, then an
      # upgrade.
      - name: Install from a local release
        shell: bash
        run: sh .github/scripts/install-smoke.sh

  # The Homebrew formula, from formula.sh, with a local build, on Linux: brew
  # installs and tests it, the binary knows brew installed it, and the
  # formula the tap gets passes brew's style and audit. Cron runs brew's opt
  # path, and a script copy installed later leaves it so. On macOS,
  # scripts/verify.sh --push runs the same smoke before the push; launchd is
  # left to the unit tests.
  brew:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: ${{ runner.environment != 'self-hosted' }}
      # Linux runners have Homebrew, off PATH.
      - run: echo /home/linuxbrew/.linuxbrew/bin >>"$GITHUB_PATH"
      # The formula names all four binaries, so all four are built.
      - name: Build a local release
        run: TARGETS="darwin/amd64 darwin/arm64 linux/amd64 linux/arm64" sh .github/scripts/dist.sh v9.9.9 "$RUNNER_TEMP/dist"
      - name: formula.sh refuses an old release and a prerelease
        run: |
          for tag in v0.7.0 v0.8.0-rc1; do
            if sh .github/scripts/formula.sh "$tag" "$RUNNER_TEMP/dist/checksums.txt" >/dev/null; then
              echo "formula.sh wrote a formula for $tag"
              exit 1
            fi
          done
      # Named in full, as people install it, so Homebrew trusts the tap.
      # Homebrew acts as on a Linux older than its own, where it gives every
      # formula its glibc and gcc; the formula must get none. A copy without
      # the override must get them, or the check proves nothing.
      - name: Install with Homebrew
        run: |
          export HOMEBREW_FORCE_LIBC_FORMULA=1 HOMEBREW_FORCE_COMPILER_FORMULA=1
          brew tap-new --no-git ci/aiu
          f="$(brew --repo ci/aiu)/Formula/ai-usage.rb"
          sh .github/scripts/formula.sh v9.9.9 "$RUNNER_TEMP/dist/checksums.txt" "file://$RUNNER_TEMP/dist" >"$f"
          cat "$f"
          control="$(brew --repo ci/aiu)/Formula/ai-usage-control.rb"
          sed '/add_global_deps_to_spec/d; s/class AiUsage /class AiUsageControl /' "$f" >"$control"
          deps=$(brew deps --include-implicit ci/aiu/ai-usage-control)
          rm "$control"
          if [ -z "$deps" ]; then
            echo 'Homebrew no longer gives a formula its glibc and gcc when forced to; the check below proves nothing'
            exit 1
          fi
          printf 'Without the override, Homebrew gives:\n%s\n' "$deps"
          deps=$(brew deps --include-implicit ci/aiu/ai-usage)
          if [ -n "$deps" ]; then
            printf 'Homebrew gives the formula dependencies:\n%s\n' "$deps"
            exit 1
          fi
          brew install ci/aiu/ai-usage
          brew test ci/aiu/ai-usage
          test "$(command -v ai-usage)" = "$(brew --prefix)/bin/ai-usage"
          test "$(ai-usage version)" = v9.9.9
      - name: The report says Homebrew updates it
        run: |
          AI_USAGE_NO_SCHEDULE=1 ai-usage </dev/null
          ai-usage report --json >"$RUNNER_TEMP/report.json"
          jq '.collector.update' "$RUNNER_TEMP/report.json"
          jq -e '.collector.update.method == "homebrew" and (.collector.update.command | test("neoromantic/tap"))' "$RUNNER_TEMP/report.json"
      # A script copy installed after the Homebrew one leaves the schedule to
      # it and says to remove itself.
      - name: Cron runs Homebrew's opt path
        run: |
          opt="$(brew --prefix)/opt/ai-usage/bin/ai-usage"
          ai-usage schedule install
          crontab -l
          crontab -l | grep -F "'$opt'"
          mkdir -p ~/.local/bin
          cp "$RUNNER_TEMP/dist/ai-usage_linux_$(go env GOARCH)" ~/.local/bin/ai-usage
          chmod 755 ~/.local/bin/ai-usage
          ~/.local/bin/ai-usage </dev/null
          crontab -l
          crontab -l | grep -F "'$opt'"
          if crontab -l | grep -F "$HOME/.local/bin/ai-usage"; then exit 1; fi
          ~/.local/bin/ai-usage report --json >"$RUNNER_TEMP/script.json"
          jq '.collector.schedule' "$RUNNER_TEMP/script.json"
          jq -e '.collector.schedule.error | test("Homebrew")' "$RUNNER_TEMP/script.json"
      # The text the tap gets, with GitHub's URLs. The audit is offline, so it
      # passes before the release's files exist.
      - name: Style and audit the formula
        run: |
          brew uninstall ci/aiu/ai-usage
          sh .github/scripts/formula.sh v9.9.9 "$RUNNER_TEMP/dist/checksums.txt" >"$(brew --repo ci/aiu)/Formula/ai-usage.rb"
          brew style ci/aiu
          brew audit --strict --formula ci/aiu/ai-usage
          brew untap ci/aiu

  # devkit's shared checks: actionlint, zizmor, gitleaks and the privacy scan
  # of the lines a change adds.
  hygiene:
    uses: neoromantic/devkit/.github/workflows/hygiene.yml@v1
    permissions:
      contents: read

  # The one check a branch ruleset requires: every job above passed.
  ci:
    needs: [lint, test, install, brew, hygiene]
    if: always() && github.event.pull_request.draft != true
    runs-on: ${{ fromJSON('{"true":"oss-linux","false":"ubuntu-latest"}')[format('{0}', vars.CI_SELF_HOSTED == 'true' && github.ref == 'refs/heads/main')] }}
    steps:
      # always(), because a step's if without a status function gets an
      # implicit success(), which is false once a needed job failed or was
      # cancelled: the step would be skipped and ci would pass.
      - if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
        run: exit 1
