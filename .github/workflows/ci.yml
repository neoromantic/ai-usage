name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The oldest Go that go.mod allows, so code that needs a newer one fails here.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "run gofmt -w on:"
            echo "$unformatted"
            exit 1
          fi
      - run: go build ./...
      - name: Shell scripts
        run: |
          for f in install.sh scripts/*.sh .github/scripts/*.sh; do sh -n "$f"; done
          shellcheck -s sh install.sh scripts/*.sh .github/scripts/*.sh
      - name: PowerShell script
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | Format-List | Out-String | Write-Host; exit 1 }
      - name: Cross-compile every release target
        run: sh .github/scripts/dist.sh v0.0.0-ci "$RUNNER_TEMP/dist"

  # Windows builds and installs (see lint and install), but its unit tests are
  # not a release gate: Windows is not a supported collector host yet.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - if: runner.os == 'Linux'
        name: vet, staticcheck and deadcode for every release OS; go mod tidy
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          go install golang.org/x/tools/cmd/deadcode@v0.50.0
          bin=$(go env GOPATH)/bin
          for os in linux darwin windows; do
            GOOS=$os go vet ./...
            GOOS=$os "$bin/staticcheck" ./...
            d=$(GOOS=$os "$bin/deadcode" -test ./...)
            [ -z "$d" ] || { echo "$d"; exit 1; }
          done
          go mod tidy -diff
      - run: go test ./...
      - if: runner.os == 'Linux'
        run: go test -race ./...

  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # Builds this runner's release file, serves it on 127.0.0.1, and runs
      # install.sh or install.ps1 against it twice: a fresh install, then an upgrade.
      - name: Install from a local release
        shell: bash
        run: sh .github/scripts/install-smoke.sh
