name: Release

# Push a tag like v1.2.3, on a commit whose CI passed, to publish. A tag with
# a suffix, like v1.2.3-rc.1, becomes a prerelease: installers and
# self-update skip it.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The Linux and Windows binaries build here, on a faster runner than
  # macOS's, and go to the release job as an artifact. CI already tested this
  # commit on Linux, so the job only checks that the Linux binary reports the
  # tag.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Build the Linux and Windows binaries
        env:
          AI_USAGE_RELAY_URL: ${{ vars.AI_USAGE_RELAY_URL }}
        run: |
          TARGETS='linux/amd64 linux/arm64 windows/amd64 windows/arm64' sh .github/scripts/dist.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/dist"
          test "$("$RUNNER_TEMP/dist/ai-usage_linux_amd64" version)" = "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-windows
          path: ${{ runner.temp }}/dist/ai-usage_*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: linux
    # macOS, because the menu bar app builds only there, and signing and
    # notarizing the macOS files need it too.
    runs-on: macos-latest
    # The only job that writes: it publishes the release. checks: read and
    # pull-requests: read let it see CI's result for the commit and for the
    # pull request that made it.
    permissions:
      contents: write
      checks: read
      pull-requests: read
    steps:
      # vet and the tests ran in CI on this very commit, on Linux, and the
      # macOS tests and the app's checks ran on a Mac before the push
      # (scripts/verify.sh --push), so they do not run again: the commit must
      # have passed CI's check ci, the one the branch ruleset requires. A
      # squash merge of an up-to-date pull request has its head's tree, so
      # ci passed on that head counts too. Otherwise a tag pushed right after
      # a merge waits here for main's CI, up to 20 minutes.
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo=repos/$GITHUB_REPOSITORY
          # SHA: "status conclusion url" of its newest ci check run.
          ci_of() {
            gh api "$repo/commits/$1/check-runs?check_name=ci&per_page=100" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions")] | max_by(.id) // empty | "\(.status) \(.conclusion) \(.html_url)"'
          }
          head=$(gh api "$repo/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null)][0].head.sha // empty') || head=
          if [ -n "$head" ]; then
            tree=$(gh api "$repo/commits/$GITHUB_SHA" --jq .commit.tree.sha) || tree=
            head_tree=$(gh api "$repo/commits/$head" --jq .commit.tree.sha) || head_tree=
            run=$(ci_of "$head") || run=
            if [ -n "$tree" ] && [ "$tree" = "$head_tree" ]; then
              case $run in
              "completed success "*)
                echo "ci passed on $head, the head of the pull request merged as $GITHUB_SHA, with the same tree: ${run##* }"
                exit 0
                ;;
              esac
            fi
            echo "the merged pull request's head $head (tree ${head_tree:-unknown} vs ${tree:-unknown}, ci: ${run:-none}) does not count; waiting for ci on $GITHUB_SHA"
          fi
          deadline=$(($(date +%s) + 1200))
          while :; do
            run=$(ci_of "$GITHUB_SHA") || run="unknown: GitHub's API failed"
            case $run in
            "completed success "*)
              echo "ci passed on $GITHUB_SHA: ${run##* }"
              break
              ;;
            completed\ *)
              echo "::error::ci did not pass on $GITHUB_SHA: $run"
              exit 1
              ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::ci has not passed on $GITHUB_SHA after 20 minutes: ${run:-no check run}"
              exit 1
            fi
            echo "waiting for ci on $GITHUB_SHA: ${run:-no check run yet}"
            sleep 30
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No module or build cache: release binaries build from a clean slate.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      # The Developer ID certificate goes into a keychain of its own and the
      # notary key into a file, both under RUNNER_TEMP, for Build alone; the
      # step after Build deletes them. Every tag is signed and notarized, a
      # prerelease too, so without the secrets the release stops here. See
      # docs/releasing.md.
      - name: Set up signing
        id: sign
        env:
          SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          if [ -z "$SIGN_P12" ] || [ -z "$NOTARY_KEY" ]; then
            echo "::error::the secrets MACOS_SIGN_P12 and NOTARY_KEY must be set to sign and notarize"
            exit 1
          fi
          keychain=$RUNNER_TEMP/sign.keychain-db
          password=$(openssl rand -hex 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          (umask 077 && printf '%s' "$SIGN_P12" | base64 --decode >"$RUNNER_TEMP/sign.p12")
          security import "$RUNNER_TEMP/sign.p12" -k "$keychain" -f pkcs12 -P "$SIGN_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/sign.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          # codesign searches this keychain and the login one.
          login=$(security default-keychain -d user | xargs)
          security list-keychains -d user -s "$keychain" "$login"
          # The identity's SHA-1, so that codesign picks this one.
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application: /{print $2; exit}')
          if [ -z "$identity" ]; then
            echo "::error::MACOS_SIGN_P12 holds no Developer ID Application identity"
            exit 1
          fi
          echo "identity=$identity" >>"$GITHUB_OUTPUT"
          mkdir -m 700 "$RUNNER_TEMP/notary"
          (umask 077 && printf '%s' "$NOTARY_KEY" | base64 --decode >"$RUNNER_TEMP/notary/key.p8")
      # The repository variable AI_USAGE_RELAY_URL, if set, becomes the
      # binaries' default relay. It reaches dist.sh through the environment,
      # never pasted into the script.
      # The Linux job's binaries, which dist.sh keeps and sums with the rest.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-windows
          path: dist
      - name: Build
        env:
          TARGETS: darwin/amd64 darwin/arm64 darwin/app
          AI_USAGE_RELAY_URL: ${{ vars.AI_USAGE_RELAY_URL }}
          AI_USAGE_SIGN_IDENTITY: ${{ steps.sign.outputs.identity }}
          AI_USAGE_NOTARY_KEY: ${{ runner.temp }}/notary/key.p8
          AI_USAGE_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          AI_USAGE_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: sh .github/scripts/dist.sh "$GITHUB_REF_NAME" dist
      - name: Remove the signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/sign.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/sign.p12" "$RUNNER_TEMP/notary"
      # The app's version is the tag without its v.
      - name: Check the build
        run: |
          test "$(./dist/ai-usage_darwin_arm64 version)" = "$GITHUB_REF_NAME"
          test "$(wc -l <dist/checksums.txt)" -eq 7
          (cd dist && shasum -a 256 --strict -c checksums.txt)
          ditto -x -k dist/ai-usage_darwin_app.zip "$RUNNER_TEMP/app"
          app="$RUNNER_TEMP/app/AI Usage.app"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$app/Contents/Info.plist")" = "${GITHUB_REF_NAME#v}"
          for arch in arm64 x86_64; do lipo "$app/Contents/MacOS/AIUsageBar" -verify_arch "$arch"; done
          codesign --verify --strict "$app"
          # Developer ID with the hardened runtime, and notarized, which
          # codesign asks Apple about online; the app has its ticket stapled.
          for f in "$app" dist/ai-usage_darwin_arm64 dist/ai-usage_darwin_amd64; do
            codesign --verify --strict --check-notarization -R=notarized "$f"
            codesign -dv "$f" 2>&1 | grep -F 'flags=0x10000(runtime)'
          done
          xcrun stapler validate "$app"
          # With Gatekeeper off, spctl accepts anything without naming a
          # source, so it is asked only when on; the check above holds either
          # way.
          if spctl --status | grep -qF 'assessments enabled'; then
            spctl -a -vv -t exec "$app" 2>&1 | grep -F 'source=Notarized Developer ID'
            for bin in dist/ai-usage_darwin_arm64 dist/ai-usage_darwin_amd64; do
              spctl -a -vv -t open --context context:primary-signature "$bin" 2>&1 | grep -F 'source=Notarized Developer ID'
            done
          else
            echo "Gatekeeper is off on this runner; codesign's notarization check stands for it"
          fi
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ $TAG == *-* ]]; then flags+=(--prerelease); fi
          # Notes written for the tag go above the generated ones, which link
          # the changes since the last release.
          if [[ -f docs/releases/$TAG.md ]]; then flags+=(--notes-file "docs/releases/$TAG.md"); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A rerun: replace the files, then make sure the release is out.
            gh release upload "$TAG" dist/* --clobber
          else
            # Created as a draft, so releases/latest never points at a release
            # whose files are still uploading.
            gh release create "$TAG" dist/* --draft --verify-tag --title "$TAG" --generate-notes "${flags[@]}"
          fi
          gh release edit "$TAG" --draft=false
      # The formula in neoromantic/homebrew-tap, for brew installs. A
      # prerelease leaves it alone; a full release fails here until the
      # secret HOMEBREW_TAP_KEY holds the tap's deploy key, and a rerun is
      # safe. See docs/releasing.md. brew audit reads the repository and
      # the release from GitHub's API, with the job's token so that a shared
      # runner's limit for anonymous calls does not fail it.
      - name: Update the Homebrew tap
        env:
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}
          TAG: ${{ github.ref_name }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: sh .github/scripts/tap.sh "$TAG" dist/checksums.txt

  # The BB plugin, as @goodit/bb-plugin-ai-usage on npm, at the tag's
  # version, after the release it installs is out. A prerelease leaves npm
  # alone. npm trusts this workflow through OIDC (trusted publishing), so no
  # token is stored; until the owner sets that up the job fails here, and a
  # rerun is safe. See docs/releasing.md.
  plugin:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true
      - name: Build and check at the tag's version
        working-directory: bb
        env:
          TAG: ${{ github.ref_name }}
        run: |
          bun install --frozen-lockfile
          npm pkg set "version=${TAG#v}"
          bun run check
          test "$(jq -r .pluginVersion dist/host.meta.json)" = "${TAG#v}"
      - name: Publish
        working-directory: bb
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if npm view "@goodit/bb-plugin-ai-usage@${TAG#v}" version >/dev/null 2>&1; then
            echo "@goodit/bb-plugin-ai-usage@${TAG#v} is already on npm"
            exit 0
          fi
          npm publish --access public --ignore-scripts
